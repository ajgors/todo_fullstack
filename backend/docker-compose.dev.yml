name: todo_development
services:
    db:
        image: postgres:latest
        container_name: todo_postgres_container_development
        restart: always
        env_file: .env
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - '${POSTGRES_PORT_LOCAL_MACHINE}:${POSTGRES_PORT}'
        volumes:
            - pg_data:/var/lib/postgresql/data
volumes:
    pg_data:
